global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: payroll-app

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Laravel in-process Prometheus registry (primary source for Business & Security dashboards)
  - job_name: payroll-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          app: payroll-app

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
