apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: elasticsearch
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    uid: elasticsearch
    editable: false
    jsonData:
      index: payroll-logs-*
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: severity

  - name: MySQL-Audits
    type: mysql
    access: proxy
    url: ${MYSQL_ANALYTICS_HOST}:${MYSQL_ANALYTICS_PORT}
    user: ${MYSQL_ANALYTICS_USER}
    editable: false
    secureJsonData:
      password: ${MYSQL_ANALYTICS_PASSWORD}
    jsonData:
      database: ${MYSQL_ANALYTICS_DB}
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
